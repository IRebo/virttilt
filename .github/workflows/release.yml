name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -A x64

      - name: Build Release binary
        run: cmake --build build --config Release

      - name: Prepare distribution files
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF -like "refs/tags/*") { $env:GITHUB_REF.Substring(10) } else { "latest" }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/Release/VirtTilt.exe dist/VirtTilt.exe

          $zipName = "VirtTilt-$tag-windows-x64.zip"
          Compress-Archive -Path dist/VirtTilt.exe, install.ps1, README.md -DestinationPath "dist/$zipName" -Force
          Write-Host "Created dist/VirtTilt.exe and dist/$zipName"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VirtTilt-windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: VirtTilt ${{ github.ref_name }}
          files: |
            dist/VirtTilt.exe
            dist/*.zip
          generate_release_notes: true
